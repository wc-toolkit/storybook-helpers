name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm lint && pnpm format:check && pnpm build

      - name: Run tests
        run: pnpm test

      - name: Install FAST example dependencies
        run: npm ci --prefix test/fixtures/fast

      - name: Install Chromium
        working-directory: test/fixtures/fast
        run: npx playwright install --with-deps chromium

      - name: Verify packed consumer
        run: pnpm test:fast

      - name: Install Lit example dependencies
        run: npm ci --prefix test/fixtures/lit

      - name: Verify Lit Docs category ordering
        run: pnpm test:lit
